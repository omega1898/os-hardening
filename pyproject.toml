[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "os-hardening"
version = "0.0.1"
description = "Phase I starting point for public SBIR/STTR topic research"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
os-hardening = "os_hardening.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
